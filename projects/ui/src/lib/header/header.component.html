<header class="noah-header">
  <a class="noah-header__home" [href]="homeHref" aria-label="回首頁">
    <img class="noah-header__logo" src="assets/images/logo.png" width="36" height="36" alt="">
    <span class="noah-header__brand">NOAH</span>
  </a>
  <div class="noah-header__actions">
    @if (userName && actions.length) {
      <div class="noah-header__account" #account>
        <button
          type="button"
          class="noah-header__name"
          aria-haspopup="menu"
          [attr.aria-expanded]="isMenuOpen"
          (click)="toggleMenu()">
          <span class="noah-header__name-text">{{ userName }}</span>
          <span class="noah-header__caret" aria-hidden="true"></span>
        </button>
        @if (isMenuOpen) {
          <div class="noah-header__menu" role="menu">
            @for (action of actions; track $index) {
              @if (action.method === 'post') {
                <form class="noah-header__logout" [action]="action.href" method="post" (submit)="submitted.emit($event)">
                  <button class="noah-header__menu-item" type="submit" role="menuitem">{{ action.label }}</button>
                </form>
              } @else {
                <a class="noah-header__menu-item" role="menuitem" [href]="action.href" (click)="closeMenu()">{{ action.label }}</a>
              }
            }
          </div>
        }
      </div>
    }
  </div>
</header>
