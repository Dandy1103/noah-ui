<button
  [attr.type]="type"
  [attr.form]="form"
  [disabled]="disabled"
  [attr.aria-pressed]="ariaPressed"
  class="noah-button u-text-md u-rounded-sm"
  [class.noah-button--small]="size === 'small'"
  [class.noah-button--secondary]="variant === 'secondary'"
  [class.noah-button--danger]="variant === 'danger'">
  {{ message }}
</button>
