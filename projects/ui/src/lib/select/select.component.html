@if (label) {
  <label class="noah-select__label" [id]="labelId" [attr.for]="controlId">{{ label }}</label>
}
<div class="noah-select">
  <button
    type="button"
    class="noah-select__control"
    [id]="controlId"
    [attr.aria-labelledby]="label ? labelId + ' ' + valueId : null"
    [attr.aria-expanded]="open()"
    [attr.aria-invalid]="errorMessage ? 'true' : null"
    [attr.aria-describedby]="errorMessage ? errorId : null"
    (click)="toggle()">
    <span [id]="valueId">{{ currentLabel }}</span>
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4 6l4 4 4-4" />
    </svg>
  </button>
  @if (open()) {
    <ul class="noah-select__menu" role="listbox">
      @for (option of options; track option.value) {
        <li>
          <button type="button" role="option" [attr.aria-selected]="option.value === value" (click)="choose(option.value)">
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
@if (errorMessage) {
  <span class="noah-select__error" [id]="errorId">{{ errorMessage }}</span>
}
