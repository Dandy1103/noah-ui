@if (label) {
  <label class="noah-select__label" [id]="labelId" [attr.for]="controlId">
    {{ label }}
    @if (required) {
      <span class="noah-select__required" aria-hidden="true">*</span>
    }
  </label>
}
<div class="noah-select">
  <button
    type="button"
    class="noah-select__control"
    [id]="controlId"
    [attr.aria-labelledby]="label ? labelId + ' ' + valueId : null"
    [attr.aria-expanded]="open()"
    [attr.aria-required]="required ? 'true' : null"
    [disabled]="isDisabled"
    [attr.aria-invalid]="errorMessage ? 'true' : null"
    [attr.aria-describedby]="errorMessage ? errorId : null"
    (click)="toggle()">
    <span [id]="valueId" [class.noah-select__placeholder]="!value">{{ currentLabel }}</span>
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4 6l4 4 4-4" />
    </svg>
  </button>
  @if (open()) {
    <ul class="noah-select__menu" [class.noah-select__menu--up]="openUp()" role="listbox">
      @for (option of choices; track option.value) {
        <li>
          <button type="button" role="option" [attr.aria-selected]="option.value === value" (click)="choose(option.value)">
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
@if (hint) {
  <span class="noah-select__hint">{{ hint }}</span>
}
@if (errorMessage) {
  <span class="noah-select__error" [id]="errorId">{{ errorMessage }}</span>
}
