<fieldset class="noah-radio-group" [disabled]="disabled">
  @if (label) { <legend class="noah-radio-group__label">{{ label }}</legend> }
  <div class="noah-radio-group__options">
    @for (option of options; track option.value; let index = $index) {
      <label class="noah-radio" [for]="groupId + '-' + index">
        <input
          class="noah-radio__control"
          type="radio"
          [id]="groupId + '-' + index"
          [name]="groupId"
          [value]="option.value"
          [checked]="value === option.value"
          [disabled]="disabled"
          (change)="choose(option.value)" />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>
</fieldset>
