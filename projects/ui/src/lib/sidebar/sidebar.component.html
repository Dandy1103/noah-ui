<nav aria-label="側邊導覽">
  @for (section of sections; track $index) {
    <div>
      <p>{{ section.title }}</p>
      @for (link of section.links; track $index) {
        <a [routerLink]="link.path" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: link.exact === true || link.path === '/' }"
           ariaCurrentWhenActive="page">{{ link.label }}</a>
      }
    </div>
  }
</nav>
