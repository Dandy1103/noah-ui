<label class="noah-input">
  @if (label) {
    <span class="noah-input__label">{{ label }}</span>
  }
  <input
    class="noah-input__control"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [attr.aria-invalid]="hasError ? 'true' : null"
    [attr.aria-describedby]="errorMessage ? errorId : null">
  @if (errorMessage) {
    <span class="noah-input__error" [id]="errorId">{{ errorMessage }}</span>
  }
</label>
